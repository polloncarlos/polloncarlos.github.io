  <script src="js/main.js"></script>
  <script>
    function handleContact() {
      const inputs = document.querySelectorAll('input, textarea');
      let allFilled = true;
      inputs.forEach(i => { if (!i.value.trim()) allFilled = false; });
      if (!allFilled) {
        alert('Por favor, preencha todos os campos.');
        return;
      }
      const email = inputs[0].value;
      const name = inputs[1].value;
      const msg = inputs[2].value;
      window.location.href = `mailto:carlos.pollon0015@gmail.com?subject=Contato via portfólio - ${name}&body=${encodeURIComponent(msg)}%0A%0AFrom: ${email}`;
    }
  </script>
